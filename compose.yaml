services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bdJaci}
      MYSQL_USER: ${DB_USER:-jaci}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em server/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD em server/.env}
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  dados_mysql:
