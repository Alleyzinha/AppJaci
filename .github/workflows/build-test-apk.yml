name: APK de teste Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: URL pública ou acessível pelo celular da API (ex.: http://192.168.1.10:3000/api)
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/build-test-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK instalável
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      CI: '1'
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Disponibilizar o APK
        uses: actions/upload-artifact@v4
        with:
          name: AppJaci-teste-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
